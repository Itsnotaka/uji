<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="June — a focused desktop home for your agents." />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://chatgpt.com https://auth.openai.com"
    />
    <title>June</title>
    <!-- First @layer statement wins ordering: Tailwind's layers must precede StyleX's
         priority layers so component styles beat preflight regardless of which
         stylesheet the dev server injects first. -->
    <style>
      @layer properties, theme, base, components, utilities, priority1, priority2, priority3,
        priority4, priority5, priority6, priority7, priority8;
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
