<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="June — a focused desktop home for your agents." />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://chatgpt.com https://auth.openai.com"
    />
    <title>June</title>
    <!-- Tailwind must load as a static link so it is declared before the StyleX sheet
         that @stylexjs/unplugin injects into head in dev (in build the plugin appends
         StyleX CSS to this asset). Later-declared cascade layers win, so this ordering
         lets StyleX component styles beat Tailwind preflight. -->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
